id: pwn_ret2libc
name: Return-to-libc (ret2libc)
category: pwn
version: "1.0"
author: system
description: >
  Exploits a buffer overflow to overwrite the return address on the stack, redirecting
  program execution to functions within the C standard library (libc), typically `system()`
  with `/bin/sh` to achieve shell. Used to bypass NX/DEP.

applies_when:
  - "context.challenge.type == 'pwn'"

min_confidence: 0.10
stop_on_flag: true

confidence_seeds:
  - if: "any(t in context.tech_stack for t in ['c', 'cpp', 'assembly', 'linux'])"
    boost: 0.20
    label: "C/C++/Assembly binary detected"
  - if: "context.binary_properties.nx_enabled == true" # Hypothetical context property
    boost: 0.15
    label: "NX bit enabled, requiring code reuse"
  - if: "context.binary_properties.canary_enabled == false" # Hypothetical context property
    boost: 0.15
    label: "Stack canary disabled, making stack overflows easier"

detection_paths:
  - id: buffer_overflow_crash_probe
    name: Buffer Overflow Crash Probe
    description: >
      Sends excessively long input to a program (likely via a network service wrapped by HTTP for 'http_probe')
      to trigger a crash or segmentation fault, indicating a buffer overflow vulnerability.
    min_confidence: 0.10
    steps:
      - id: send_long_input
        action: http_probe # Placeholder for binary interaction; ideally a generic 'probe'
        params:
          method: POST # Or GET, depending on how input is passed
          path: '/submit' # Example endpoint for interacting with a service
          body: 'A_REPEATED_LONG_INPUT_PLACEHOLDER'
        signals:
          - match: '500 Internal Server Error' # A common web server response for application crashes
            on_match:
              confidence_boost: 0.40
              emit: buffer_overflow_detected
          - match: 'Segmentation fault' # Direct crash message (less likely via HTTP but possible)
            on_match:
              confidence_boost: 0.50
              emit: buffer_overflow_detected

  - id: format_string_info_leak_probe
    name: Format String Info Leak Probe
    description: >
      Sends format string specifiers (e.g., %p, %x) to a program (wrapped by HTTP) and looks for
      leaked memory addresses (stack, libc, binary base) in the response.
    min_confidence: 0.15
    steps:
      - id: send_format_string_payload
        action: http_probe # Placeholder for binary interaction
        params:
          method: POST
          path: '/echo' # Example endpoint that reflects user input
          body: 'Name: %p %p %p %p %p %p %p %p %p %p'
        signals:
          - match: '0x[0-9a-fA-F]{8,16}' # Matches hexadecimal addresses (8 for 32-bit, 16 for 64-bit)
            match_type: regex
            on_match:
              confidence_boost: 0.45
              emit: info_leak_detected

exploitation_paths:
  - id: ret2libc_rce_via_leak_and_overflow
    name: Ret2libc RCE via Info Leak and Buffer Overflow
    requires_signal: info_leak_detected # Requires a prior info leak to bypass ASLR
    technique: ret2libc_aslr_bypass
    description: >
      An info leak was detected, allowing for ASLR bypass. This path outlines the strategy
      to construct a ret2libc payload for Remote Code Execution (RCE) by overwriting
      the return address with libc function addresses.
    steps:
      - id: calculate_libc_offsets
        action: http_probe # Still using http_probe as a conceptual action
        params:
          # This step would typically involve offline calculation using leaked addresses
          # and a known libc version. Here, it's a symbolic step.
          comment: "Calculate libc base address, system() address, and /bin/sh string address from leaked info."
        capture:
          - pattern: '(?i)libc_base: (0x[0-9a-fA-F]+)'
            as: libc_base_address
          - pattern: '(?i)system_addr: (0x[0-9a-fA-F]+)'
            as: system_function_address
          - pattern: '(?i)bin_sh_addr: (0x[0-9a-fA-F]+)'
            as: bin_sh_string_address

      - id: construct_and_send_ret2libc_payload
        action: http_probe # Placeholder for binary interaction
        params:
          method: POST
          path: '/submit' # Example endpoint for interacting with a service
          # This payload is conceptual and depends heavily on architecture (x86/x64) and padding.
          # Example for x64: padding + pop_rdi_gadget + bin_sh_addr + ret_gadget + system_addr
          body: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' # Placeholder padding
          # Dynamically generated payload with actual addresses would go here.
        capture:
          - pattern: 'flag\{[^}]+\}'
            as: flag_value
          - pattern: 'CTF\{[^}]+\}'
            as: flag_value
          - pattern: '(?i)whoami|uid=\d+' # Confirm shell execution
            as: shell_access_confirmed
