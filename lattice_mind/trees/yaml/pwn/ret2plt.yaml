id: pwn_ret2plt
name: Return-to-PLT (ret2plt)
category: pwn
version: "1.0"
author: system
description: >
  Exploits a buffer overflow to redirect execution to a function's entry in the Procedure
  Linkage Table (PLT). Often used as a first stage to leak libc addresses from the GOT
  to bypass ASLR, enabling a subsequent ret2libc attack for RCE.

applies_when:
  - "context.challenge.type == 'pwn'"

min_confidence: 0.10
stop_on_flag: true

confidence_seeds:
  - if: "any(t in context.tech_stack for t in ['c', 'cpp', 'assembly', 'linux'])"
    boost: 0.20
    label: "C/C++/Assembly binary detected"
  - if: "context.binary_properties.nx_enabled == true"
    boost: 0.15
    label: "NX bit enabled, requiring code reuse"
  - if: "context.binary_properties.pie_enabled == false" # Position Independent Executable disabled
    boost: 0.20
    label: "PIE disabled, static PLT addresses available"

detection_paths:
  - id: buffer_overflow_crash_probe_plt
    name: Buffer Overflow Crash Probe (for PLT)
    description: >
      Sends excessively long input to trigger a crash, indicating a buffer overflow that
      could be used to overwrite the return address.
    min_confidence: 0.10
    steps:
      - id: send_long_input_plt
        action: http_probe # Placeholder for binary interaction; ideally a generic 'probe'
        params:
          method: POST
          path: '/submit'
          body: '
signals:
          - match: '(?i)crash|fail(ed)? to process input|error in query'
            on_match:
              confidence_boost: 0.40
              emit: buffer_overflow_detected_plt
          - match: '500 Internal Server Error'
            on_match:
              confidence_boost: 0.30
              emit: buffer_overflow_detected_plt

  - id: plt_function_leak_probe
    name: PLT Function Address Leak Probe
    description: >
      Sends a payload crafted to trigger `puts@plt` with `puts@got` as an argument
      (via a buffer overflow), expecting the program to output the resolved address
      of `puts` in libc.
    min_confidence: 0.20
    steps:
      - id: send_leak_payload
        action: http_probe # Placeholder for binary interaction
        params:
          method: POST
          path: '/submit'
          # This payload requires careful calculation of padding, PLT, and GOT addresses
          # It's a conceptual representation. Actual payloads are binary data.
          body: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' + 'PUTS_PLT_ADDR' + 'MAIN_ADDR_TO_RETURN_TO' + 'PUTS_GOT_ADDR'
        signals:
          - match: '0x[0-9a-fA-F]{8,16}' # Matches hexadecimal addresses (8 for 32-bit, 16 for 64-bit)
            match_type: regex
            on_match:
              confidence_boost: 0.50
              emit: libc_address_leaked_plt

exploitation_paths:
  - id: ret2plt_rce_two_stage
    name: Ret2plt two-stage RCE (Leak then Execute)
    requires_signal: libc_address_leaked_plt
    technique: ret2plt_full_exploit
    description: >
      A libc address was successfully leaked via ret2plt. This enables calculation of
      libc base, system() and "/bin/sh" addresses for a subsequent ret2libc attack.
      The steps outline a conceptual two-stage RCE.
    steps:
      - id: calculate_libc_offsets_stage2
        action: http_probe # Conceptual action
        params:
          comment: "Calculate libc base, system(), and /bin/sh string addresses using the leaked libc address."
        capture:
          - pattern: '(?i)libc_base: (0x[0-9a-fA-F]+)'
            as: calculated_libc_base
          - pattern: '(?i)system_addr: (0x[0-9a-fA-F]+)'
            as: calculated_system_addr
          - pattern: '(?i)bin_sh_addr: (0x[0-9a-fA-F]+)'
            as: calculated_bin_sh_addr

      - id: send_ret2libc_payload_stage2
        action: http_probe # Placeholder for binary interaction
        params:
          method: POST
          path: '/submit'
          # This payload is conceptual. It would be a full ret2libc payload constructed
          # with the calculated addresses.
          body: 'BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB' # Placeholder
        capture:
          - pattern: 'flag\{[^}]+\}'
            as: flag_value
          - pattern: 'CTF\{[^}]+\}'
            as: flag_value
          - pattern: '(?i)whoami|uid=\d+' # Confirm shell execution
            as: shell_access_confirmed
