services:
  lattice-mind-api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn lattice_mind.api.server:app --host 0.0.0.0 --port 8000
    environment:
      LATTICE_MIND_LOG_LEVEL: info
      LATTICE_MIND_DB: /data/runs.db
    volumes:
      - lattice-mind-data:/data

volumes:
  lattice-mind-data:
