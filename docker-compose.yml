services:
  # ── Production ─────────────────────────────────────────────────────────────
  # DO App Platform ignores docker-compose entirely (builds from Dockerfile).
  # If deploying via docker compose on a Droplet: docker compose --profile prod up
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500
    profiles:
      - prod
      - dev

  lattice-mind-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: uvicorn lattice_mind.api.server:app --host 0.0.0.0 --port 8000
    environment:
      LATTICE_MIND_LOG_LEVEL: info
      LATTICE_MIND_DB: /data/runs.db
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      - lattice-mind-data:/data
    profiles:
      - prod

  # ── Development (hot-reload) ────────────────────────────────────────────────
  # Mounts local source into the container — edit any .py or .yaml and the
  # server reloads instantly without a rebuild or restart.
  #
  # Usage:  docker compose --profile dev up [--build]
  #   or:   .\dev.ps1
  lattice-mind-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    command: >
      uvicorn lattice_mind.api.server:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app
        --reload-include '*.yaml'
        --reload-include '*.yml'
    environment:
      LATTICE_MIND_LOG_LEVEL: debug
      LATTICE_MIND_DB: /data/runs.db
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      # Live-mount the entire project — edits on disk = live in container
      - .:/app
      # Keep the data volume separate so it isn't overwritten by the mount
      - lattice-mind-data:/data
    profiles:
      - dev

volumes:
  lattice-mind-data:
